[build]
  publish = "public"
  functions = "netlify/functions"
  command = "node build.mjs"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/icons.*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/ic/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
